<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>AlphaMind 登录</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="auth-page"><div class="auth-card"><div class="auth-logo"><img src="/static/alphamind_logo.png" alt="AlphaMind"></div><h1 class="auth-title">AlphaMind</h1><div class="auth-sub">智能投顾系统 · 数据驱动的资产配置助手</div><input class="form-input" id="account" placeholder="用户名 / 邮箱"><input class="form-input" id="password" type="password" placeholder="密码"><button class="primary-btn" onclick="login()">登录</button><div class="auth-link">还没有账号？<a href="/register">立即注册</a></div></div></div>
<script>async function login(){const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:account.value,password:password.value})});const data=await res.json();if(data.success){location.href="/chat"}else{alert(data.msg||"登录失败")}}</script>
</body></html>
