<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>AlphaMind 注册</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="auth-page"><div class="auth-card"><div class="auth-logo"><img src="/static/alphamind_logo.png" alt="AlphaMind"></div><h1 class="auth-title">创建账号</h1><div class="auth-sub">注册 AlphaMind 智能投顾账户</div><input class="form-input" id="username" placeholder="用户名"><input class="form-input" id="email" type="email" placeholder="邮箱"><input class="form-input" id="password" type="password" placeholder="密码，至少6位"><input class="form-input" id="confirm_password" type="password" placeholder="再次确认密码"><div class="auth-tip">注册成功后会自动跳回登录页。</div><button class="primary-btn" onclick="register()">注册</button><div class="auth-link">已有账号？<a href="/">返回登录</a></div></div></div>
<script>async function register(){const res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,email:email.value,password:password.value,confirm_password:confirm_password.value})});const data=await res.json();if(data.success){alert("注册成功，请登录");location.href="/"}else{alert(data.msg||"注册失败")}}</script>
</body></html>
