<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlphaMind 控制台</title>
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;background:#fff8f2;margin:0;padding:20px;color:#2c1a12}
    .wrap{max-width:1000px;margin:0 auto}
    .card{background:#fff;border:1px solid #e7d9cd;border-radius:12px;padding:16px;margin-bottom:14px}
    h1{color:#8b0012} h3{margin:0 0 10px;color:#8b0012}
    input,textarea,button{padding:8px;border-radius:8px;border:1px solid #d9cabc}
    textarea{width:100%;min-height:80px}
    button{background:#8b0012;color:#fff;cursor:pointer}
    pre{background:#f7f2ec;padding:10px;border-radius:8px;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="wrap">
  <h1>AlphaMind Web 控制台（对齐 app.py）</h1>
  <div class="card">
    <h3>1) 快速生成建议</h3>
    <input id="uid1" placeholder="用户ID" value="guest" />
    <textarea id="q1" placeholder="请输入你的情况"></textarea>
    <button onclick="quick()">生成建议</button>
  </div>
  <div class="card">
    <h3>2) 查看最新建议 / 3) 查看全部历史 / 6) 删除用户记录</h3>
    <input id="uid2" placeholder="用户ID" value="guest" />
    <button onclick="latest()">最新建议</button>
    <button onclick="allHistory()">全部历史</button>
    <button onclick="delHistory()">删除记录</button>
  </div>
  <div class="card">
    <h3>5) 查看所有用户</h3>
    <button onclick="allUsers()">刷新用户列表</button>
  </div>
  <div class="card">
    <h3>对话咨询入口（对应 app.py 菜单1）</h3>
    <a href="/consultation.html">打开 consultation.html</a>
  </div>
  <div class="card">
    <h3>输出</h3>
    <pre id="out">就绪</pre>
  </div>
</div>
<script>
const out = document.getElementById('out');
async function call(url, options={}) {
  const r = await fetch(url, options);
  const j = await r.json();
  out.textContent = JSON.stringify(j, null, 2);
}
function quick(){
  call('/api/advice/quick', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
    user_id: document.getElementById('uid1').value,
    user_input: document.getElementById('q1').value
  })});
}
function latest(){ call('/api/history/latest/' + encodeURIComponent(document.getElementById('uid2').value)); }
function allHistory(){ call('/api/history/all/' + encodeURIComponent(document.getElementById('uid2').value)); }
function delHistory(){ call('/api/history/' + encodeURIComponent(document.getElementById('uid2').value), {method:'DELETE'}); }
function allUsers(){ call('/api/users'); }
</script>
</body>
</html>
